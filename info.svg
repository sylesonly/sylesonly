<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
<!-- ==========================================================
     TEXTE HIER ÄNDERN (nur die Wörter zwischen > und < )
     ========================================================== -->
<style>
text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.pulse{animation:p 3s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.75}50%{opacity:1}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.7}}
</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1A22"/><stop offset="1" stop-color="#05080C"/></linearGradient>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#3EC8FF" stop-opacity="0"/><stop offset=".5" stop-color="#3EC8FF" stop-opacity=".6"/><stop offset="1" stop-color="#3EC8FF" stop-opacity="0"/></linearGradient>
<clipPath id="r"><rect width="1200" height="260" rx="14"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="260" fill="url(#sky)"/>
<circle class="tw" cx="120" cy="60" r="1.2" fill="#fff"/><circle class="tw" style="animation-delay:1s" cx="980" cy="40" r="1" fill="#fff"/><circle class="tw" style="animation-delay:2s" cx="1080" cy="215" r="1.3" fill="#fff"/><circle class="tw" style="animation-delay:.5s" cx="200" cy="205" r="1" fill="#fff"/><circle class="tw" style="animation-delay:3s" cx="640" cy="30" r="1" fill="#fff"/><circle class="tw" style="animation-delay:1.5s" cx="860" cy="225" r="1.1" fill="#fff"/>
<rect x="300" y="18" width="600" height="2" fill="url(#line)"/>

<!-- ROLLE -->
<text x="600" y="68" text-anchor="middle" font-size="26" font-weight="600" fill="#E8EEF2">Business Process &amp; System Engineer</text>
<text x="600" y="96" text-anchor="middle" font-size="15" fill="#8A95A3">CEO of the4ce GmbH</text>

<!-- SCHWERPUNKTE -->
<text x="600" y="134" text-anchor="middle" font-size="14" letter-spacing="4" fill="#3EC8FF">AUTOMATION  ·  AI SYSTEMS  ·  TRADING TECHNOLOGY</text>

<!-- KURZTEXT -->
<text x="600" y="168" text-anchor="middle" font-size="15" fill="#B7C3CC">I connect business processes with the systems behind them: ERP, workflow automation and AI.</text>
<text x="600" y="192" text-anchor="middle" font-size="15" fill="#B7C3CC">Strong in Python and in designing AI system architectures. Future-oriented: I build for what comes next.</text>

<!-- STATUS -->
<g class="pulse"><rect x="500" y="214" width="200" height="30" rx="4" fill="#3EC8FF"/><text x="600" y="234" text-anchor="middle" font-size="12" letter-spacing="2.5" font-weight="700" fill="#07121A">OPEN TO NEW IT ROLES</text></g>

<g fill="none" stroke="#3EC8FF" stroke-opacity=".5" stroke-width="2"><path d="M24 54V24H54"/><path d="M1146 24H1176V54"/><path d="M24 206V236H54"/><path d="M1146 236H1176V206"/></g>
</g>
</svg>
